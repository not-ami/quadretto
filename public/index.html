<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Quadretto</title>
<meta name="description" content="Appunti e quaderni per i tuoi studi avanzati">
<meta name="theme-color" content="#f4f6fb" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1117" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Quadretto">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/icon-180.png">
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/vendor/font-display/wght.css">
<link rel="stylesheet" href="/vendor/font-mono/wght.css">
<link rel="stylesheet" href="/vendor/katex/katex.min.css">
<link rel="stylesheet" href="/css/app.css">
<script src="/vendor/marked/marked.umd.js" defer></script>
<script src="/vendor/purify/purify.min.js" defer></script>
<script src="/vendor/katex/katex.min.js" defer></script>
<script src="/vendor/hljs/highlight.min.js" defer></script>
<script type="module" src="/js/app.js"></script>
</head>
<body>
<div id="app" class="app" data-view="list">
  <aside class="side" id="side" aria-label="Quaderni">
    <div class="side-head">
      <button class="brand" id="brand" aria-label="Vai alla Home"><span class="brand-mark" aria-hidden="true"></span><span>Quadretto</span></button>
      <button class="icon-btn only-narrow" id="side-close" aria-label="Chiudi elenco quaderni"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <label class="search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
      <input id="search" type="search" placeholder="Cerca negli appunti" autocomplete="off" enterkeyhint="search">
    </label>
    <nav class="side-nav" id="side-nav"></nav>
    <div class="side-foot">
      <button class="side-link" id="btn-news"><svg viewBox="0 0 24 24"><path d="M12 3l2.3 5.2 5.7.5-4.3 3.8 1.3 5.5L12 15.1 7 18l1.3-5.5L4 8.7l5.7-.5z"/></svg><span data-t>Novità</span><span class="news-dot" hidden></span></button>
      <button class="side-link" id="btn-settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg><span data-t>Impostazioni</span></button>
      <div class="sync" id="sync" role="status" aria-live="polite"><span class="dot"></span><span class="sync-text">Avvio</span></div>
      <span class="signature" title="Quadretto, di AMi" aria-label="Firma: AMi">AMi</span>
    </div>
  </aside>
  <div class="scrim" id="scrim"></div>

  <section class="list" id="list" aria-label="Appunti">
    <header class="list-head">
      <button class="icon-btn only-narrow" id="side-open" aria-label="Apri quaderni"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h10"/></svg></button>
      <button class="icon-btn only-wide" id="side-toggle" aria-label="Mostra o nascondi quaderni"><svg viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="2.5"/><path d="M9 4.5v15"/></svg></button>
      <div class="list-title" id="list-title"></div>
      <div class="layout-seg" id="layout-seg" role="group" aria-label="Vista">
        <button id="lay-list" aria-label="Vista elenco" title="Elenco"><svg viewBox="0 0 24 24"><path d="M8 6h12M8 12h12M8 18h12"/><circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/></svg></button>
        <button id="lay-gallery" aria-label="Vista galleria" title="Galleria"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="9" rx="1.5"/><rect x="13" y="4" width="7" height="9" rx="1.5"/><path d="M4 17h7M13 17h7M4 20h5M13 20h5"/></svg></button>
      </div>
      <button class="icon-btn" id="nb-edit" aria-label="Modifica quaderno" hidden><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/></svg></button>
    </header>
    <div class="list-body" id="list-body"></div>
    <div class="fab-row">
      <button class="fab fab-pdf" id="new-pdf" aria-label="Nuovo appunto da un PDF" title="Importa un PDF da annotare"><svg viewBox="0 0 24 24"><path d="M6.5 3.5h8l4 4v13h-12z"/><path d="M14.5 3.5v4h4"/><path d="M12 10.5v6M9.5 14l2.5 2.5 2.5-2.5"/></svg><span>PDF</span></button>
      <button class="fab" id="new-note" aria-label="Nuovo appunto"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span data-t>Nuovo appunto</span></button>
    </div>
  </section>

  <main class="editor" id="editor" aria-label="Appunto"></main>
  <section class="home" id="home" aria-label="Home"></section>
</div>

<div class="sheet-wrap" id="sheet" hidden><div class="sheet" role="dialog" aria-modal="true" id="sheet-body"></div></div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
